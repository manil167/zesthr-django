{% extends "auth_base.html" %}
{% block title %}Check your email{% endblock %}
{% block card %}
  <div class="login-card">
    <h2>Check your email</h2>
    <p class="login-subtext">If an account with that address exists, a reset link is on its way. The link works for a limited time and only once.</p>
    <a class="btn hros-btn-lg" href="{% url 'login' %}">Back to sign in</a>
  </div>
{% endblock %}
