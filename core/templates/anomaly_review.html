{% extends "base.html" %}
{% block title %}Review attendance exception{% endblock %}
{% block content %}
<div class="head"><h1>{{ item.employee }}: {{ item.get_kind_display }}</h1></div>
<section class="card"><p>{{ item.date }}</p><dl>{% for key, value in item.evidence.items %}<dt>{{ key }}</dt><dd>{{ value }}</dd>{% endfor %}</dl>
<form method="post">{% csrf_token %}<label>Decision <select name="status"><option value="RESOLVED">Resolved</option><option value="DISMISSED">Dismissed after review</option></select></label>
<label>Review explanation <textarea name="note" required maxlength="255"></textarea></label><button class="btn">Record review</button></form></section>
{% endblock %}
