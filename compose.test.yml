services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hros
      POSTGRES_USER: hros
      POSTGRES_PASSWORD: hros-integration-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hros -d hros"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
